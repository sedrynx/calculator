<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="container">
      <div class="calculator">
        <div class="result">
          <span>59434234322</span>
        </div>
        <div class="row1">
          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button>C</button>
        </div>
        <div class="row2">
          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button>&plus;</button>
        </div>
        <div class="row3">
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button>&minus;</button>
        </div>
        <div class="row4">
          <button>0</button>
          <button>&divide;</button>
          <button>&times;</button>
          <button>&equals;</button>
        </div>
      </div>
    </div>
  </body>
</html>
